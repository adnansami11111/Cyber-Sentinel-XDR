services:
  cyber-sentinel-xdr:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cyber-sentinel-xdr

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      APP_ENV: LAB
      DEBUG: "False"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: sqlite+aiosqlite:///./data/cyber_sentinel.db

    volumes:
      - cyber_sentinel_data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; r=urlopen('http://127.0.0.1:8000/api/health', timeout=3); assert r.status == 200"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cyber_sentinel_data:
